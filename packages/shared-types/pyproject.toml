[project]
name = "geoadmin-shared-types"
version = "0.1.0"
description = "Shared domain and API contracts for GeoAdmin."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.0,<3.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
