[project]
name = "geoadmin-api"
version = "0.1.0"
description = "FastAPI service for GeoAdmin calculations and technical workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0.0",
    "uvicorn[standard]>=0.35.0,<1.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "pyproj>=3.7.0,<4.0.0",
    "shapely>=2.1.0,<3.0.0",
    "ezdxf>=1.4.0,<2.0.0",
    "supabase>=2.27.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
